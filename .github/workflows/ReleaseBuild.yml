name: ReleaseBuild
on:
  push:
   branches:
    - master

env:
 SOLUTION_FILE_PATH: Slash.sln
 CONFIGURATION: Release

jobs:
 build:
  runs-on: windows-2025-vs2026

  steps:
   - name: Checkout
     uses: actions/checkout@v4

   # .takoproject に書いてあるバージョンの SDK を、エンジンのリリースから Engine/TakoEngine に入れる
   - name: Install TakoEngine
     shell: pwsh
     run: ./UpdateEngine.ps1

   - name: Add MSBuild to PATH
     uses: microsoft/setup-msbuild@v2
     with:
      msbuild-architecture: x64

   - name: Build
     run: msbuild ${{env.SOLUTION_FILE_PATH}} /p:Platform=x64,Configuration=${{env.CONFIGURATION}}
